[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-file-measurement-api"
version = "0.1.0"
description = "Production-grade backend service for ingesting geospatial vector files, calculating metric measurements with accurate CRS transformations, and exposing RESTful inspection endpoints."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Aereo Software Development Intern Assignment" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "defusedxml>=0.7.1",
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    "fiona>=1.9.6",
    "fastkml>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]
